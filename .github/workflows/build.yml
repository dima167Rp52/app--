name: Build FileMaster EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name FileMaster app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FileMaster-Windows
          path: dist/FileMaster.exe
          if-no-files-found: error
          retention-days: 14
